# Optional local external PostgreSQL, separate from the default embedded database.
# Set DATABASE_URL=postgresql://flingtopia:local-development-only@127.0.0.1:5432/flingtopia
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flingtopia
      POSTGRES_USER: flingtopia
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flingtopia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
