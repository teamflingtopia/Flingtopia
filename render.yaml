# Free staging only. Run migrations separately before starting this service.
services:
  - type: web
    name: flingtopia-staging
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DEMO_MODE
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: "true"
      - key: MEDIA_STORAGE
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: flingtopia-photos-staging
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: STAGING_ACCESS_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
